name: Subtitle quality
on:
  pull_request:
    branches: [main, fix/subtitle-settings-french]
    paths:
      - 'Orvian/Core/Media/Subtitle*.swift'
      - 'Orvian/Core/Media/Prepared*.swift'
      - 'Orvian/Features/Viewer/Prepared*.swift'
      - 'Tests/iOS/PreparedSubtitleTests.swift'
      - 'Tests/Parakeet/**'
      - 'Orvian/Core/Media/SpeechProbe*.swift'
      - 'Orvian/Features/Viewer/VideoSpeechProbe.swift'
      - 'Orvian/UI/SubtitleOverlay.swift'
      - 'Orvian/Features/Settings/SubtitleSettingsView.swift'
      - 'Orvian/Features/Settings/SettingsView.swift'
      - 'Orvian/Features/Viewer/VideoPlayerView.swift'
      - 'Orvian/App/TabNavigationState.swift'
      - 'Tests/iOS/SubtitleQualityTests.swift'
      - 'Tests/test_subtitle_cues.py'
      - 'project.yml'
      - '.github/workflows/subtitle-quality.yml'
permissions:
  contents: read
jobs:
  subtitles:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check subtitle timeline
        run: python3 -m unittest discover -s Tests -p test_subtitle_cues.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile app and run subtitle logic tests without visual capture
        shell: bash
        run: |
          set -o pipefail
          xcodegen generate
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project Orvian.xcodeproj -scheme Orvian \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/subtitle-tests" \
            -only-testing:OrvianTests/SubtitleQualityTests \
            -only-testing:OrvianTests/PreparedSubtitleTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test

  ultra-inference:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate non-private English speech longer than one model window
        run: |
          /usr/bin/say -r 140 -o "$RUNNER_TEMP/ultra-fixture.aiff" "Welcome to this subtitle test. The farmer walked through the orchard carrying a bright lantern. We are checking every spoken sentence and its timing carefully. The entire recording is processed before the video starts. Yesterday the farmer walked through the orchard carrying a bright lantern. We are checking every spoken sentence and its timing carefully. The entire recording is processed before the video starts. Today the farmer walked through the orchard carrying a bright lantern. We are checking every spoken sentence and its timing carefully. The entire recording is processed before the video starts. This final sentence confirms that the transcription is complete."
      - name: Download actual Ultra model and verify long-form inference without visual capture
        run: swift run --package-path Tests/Parakeet -c release UltraSmoke "$RUNNER_TEMP/ultra-fixture.aiff"
