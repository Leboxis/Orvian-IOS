name: Subtitle quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/subtitle-settings-french]
    paths:
      - 'Orvian/Core/Media/Subtitle*.swift'
      - 'Orvian/Core/Media/Prepared*.swift'
      - 'Orvian/Features/Viewer/Prepared*.swift'
      - 'Tests/iOS/PreparedSubtitleTests.swift'
      - 'Tests/iOS/PreparedAudioTests.swift'
      - 'Tests/iOS/prepared-audio.*'
      - 'Tests/iOS/prepared-delay.mkv'
      - 'Orvian/Core/Media/SpeechProbe*.swift'
      - 'Orvian/Features/Viewer/VideoSpeechProbe.swift'
      - 'Orvian/UI/SubtitleOverlay.swift'
      - 'Orvian/Features/Settings/SubtitleSettingsView.swift'
      - 'Orvian/Features/Settings/SettingsView.swift'
      - 'Orvian/Features/Viewer/VideoPlayerView.swift'
      - 'Orvian/App/TabNavigationState.swift'
      - 'Tests/iOS/SubtitleQualityTests.swift'
      - 'Tests/test_subtitle_cues.py'
      - 'Native/PreparedAudio/**'
      - '.github/scripts/build_prepared_audio.sh'
      - 'docs/prepared-audio-decoder.md'
      - 'Orvian/Resources/Settings.bundle/**'
      - 'project.yml'
      - '.github/workflows/subtitle-quality.yml'
permissions:
  contents: read
jobs:
  subtitles:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check subtitle timeline
        run: python3 -m unittest discover -s Tests -p test_subtitle_cues.py
      - name: Install XcodeGen and CocoaPods
        run: brew install xcodegen cocoapods
      - name: Identify prepared audio toolchain
        id: prepared-audio-toolchain
        run: echo "version=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Cache isolated prepared audio decoder
        uses: actions/cache@v4
        with:
          path: |
            Vendor/OrvianAudioDecoder.xcframework
            Vendor/OrvianAudioDecoder-Settings.plist
            Vendor/OrvianAudioDecoder-relink.tar.gz
            Vendor/OrvianAudioDecoder-build.sha256
          key: prepared-audio-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepared-audio-toolchain.outputs.version }}-ffmpeg-9.0.2-8c385028-${{ hashFiles('.github/scripts/build_prepared_audio.sh', 'Native/PreparedAudio/**', 'docs/prepared-audio-decoder.md') }}
      - name: Build and verify isolated prepared audio decoder
        run: bash .github/scripts/build_prepared_audio.sh
      - name: Compile app and run subtitle logic tests without visual capture
        shell: bash
        run: |
          set -o pipefail
          xcodegen generate
          pod install
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -workspace Orvian.xcworkspace -scheme Orvian \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/subtitle-tests" \
            -only-testing:OrvianTests/SubtitleQualityTests \
            -only-testing:OrvianTests/PreparedSubtitleTests \
            -only-testing:OrvianTests/PreparedAudioTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
