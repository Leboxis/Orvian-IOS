name: Subtitle quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/french-subtitle-quality]
permissions:
  contents: read
jobs:
  subtitles:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check subtitle timeline
        run: python3 -m unittest discover -s Tests -p test_subtitle_cues.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile app and run subtitle logic tests without visual capture
        shell: bash
        run: |
          set -o pipefail
          xcodegen generate
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-26" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project Orvian.xcodeproj -scheme Orvian \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/subtitle-tests" \
            -only-testing:OrvianTests/SubtitleQualityTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
