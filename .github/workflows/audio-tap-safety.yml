name: Audio tap safety
on:
  workflow_dispatch:
  push:
    branches: [fix/subtitle-audio-crash, fix/subtitle-settings-french, feature/prepared-french-subtitles]
    paths:
      - 'Orvian/Core/Media/PlayerSpeechAudioTap.swift'
      - 'Orvian/Core/Media/SpeechProbeMailbox.swift'
      - 'Orvian/Features/Settings/**'
      - 'Orvian/Core/Media/Subtitle*.swift'
      - 'Orvian/Core/Media/Prepared*.swift'
      - 'Orvian/Features/Viewer/Prepared*.swift'
      - 'Orvian/Features/Viewer/Video*.swift'
      - 'Orvian/UI/SubtitleOverlay.swift'
      - 'Tests/AudioTap/**'
      - 'Native/PreparedAudio/**'
      - '.github/scripts/build_prepared_audio.sh'
      - 'docs/prepared-audio-decoder.md'
      - 'Orvian/Resources/Settings.bundle/**'
      - 'project.yml'
      - '.github/workflows/audio-tap-safety.yml'
permissions:
  contents: read
jobs:
  callbacks:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real audio callbacks outside MainActor
        run: |
          swiftc -parse-as-library -swift-version 5 -Xfrontend -enable-actor-data-race-checks \
            Orvian/Core/Media/SpeechProbeMailbox.swift \
            Orvian/Core/Media/PlayerSpeechAudioTap.swift \
            Tests/AudioTap/CallbackChecks.swift -o "$RUNNER_TEMP/audio-tap-checks"
          "$RUNNER_TEMP/audio-tap-checks"
      - name: Install XcodeGen and CocoaPods
        run: brew install xcodegen cocoapods
      - name: Identify prepared audio toolchain
        id: prepared-audio-toolchain
        run: echo "version=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Cache isolated prepared audio decoder
        uses: actions/cache@v4
        with:
          path: |
            Vendor/OrvianAudioDecoder.xcframework
            Vendor/OrvianAudioDecoder-Settings.plist
            Vendor/OrvianAudioDecoder-relink.tar.gz
            Vendor/OrvianAudioDecoder-build.sha256
          key: prepared-audio-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepared-audio-toolchain.outputs.version }}-ffmpeg-9.0.2-8c385028-${{ hashFiles('.github/scripts/build_prepared_audio.sh', 'Native/PreparedAudio/**', 'docs/prepared-audio-decoder.md') }}
      - name: Build and verify isolated prepared audio decoder
        run: bash .github/scripts/build_prepared_audio.sh
      - name: Build unsigned iOS candidate
        run: |
          xcodegen generate
          pod install
          xcodebuild -workspace Orvian.xcworkspace -scheme Orvian \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-audio-safety \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package candidate IPA
        run: |
          mkdir -p candidate/Payload
          cp -R build-audio-safety/Build/Products/Release-iphoneos/Orvian.app candidate/Payload/
          cd candidate
          zip -qry ../Orvian-Apple-Subtitles-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Orvian-Apple-Subtitles-IPA
          path: |
            Orvian-Apple-Subtitles-unsigned.ipa
            Vendor/OrvianAudioDecoder-relink.tar.gz
          if-no-files-found: error
