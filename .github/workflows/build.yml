name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (LiveContainer ready)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Orvian.xcodeproj \
            -scheme Orvian \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Orvian.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Orvian-${VERSION}-unsigned.ipa" Payload
          ls -lh "Orvian-${VERSION}-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-unsigned-ipa
          path: Orvian-*-unsigned.ipa

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Orvian-*-unsigned.ipa
          generate_release_notes: true

      - name: Update LiveContainer source (repo.json, tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SIZE=$(stat -f%z "Orvian-${VERSION}-unsigned.ipa")
          TODAY=$(date +%Y-%m-%d)
          python3 .github/scripts/update_repo.py "$VERSION" "$GITHUB_REF_NAME" "$SIZE" "$TODAY" > repo.json
          if ! git diff --quiet repo.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repo.json
            git commit -m "repo.json : Orvian $VERSION (source LiveContainer)"
            # Le checkout d'un tag est en detached HEAD : pousser explicitement vers main
            if ! git push origin HEAD:main; then
              echo "::warning::repo.json non poussé (conflit de branche ?) — mise à jour manuelle requise"
            fi
          else
            echo "repo.json déjà à jour."
          fi
