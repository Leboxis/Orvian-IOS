name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # La mise à jour du catalogue LiveContainer est poussée par ce workflow.
    # Elle ne doit pas déclencher une seconde publication.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    name: Build unsigned IPA (LiveContainer ready)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next LiveContainer version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -z "$LATEST_TAG" ]]; then
            NEXT_VERSION="0.1.0"
          elif [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            echo "Version de tag invalide : $LATEST_TAG" >&2
            exit 1
          fi
          echo "value=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Set release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("project.yml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'MARKETING_VERSION: "[^"]+"',
              f'MARKETING_VERSION: "{sys.argv[1]}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("MARKETING_VERSION introuvable dans project.yml")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Orvian.xcodeproj \
            -scheme Orvian \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Orvian.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Orvian-${VERSION}-unsigned.ipa" Payload
          ls -lh "Orvian-${VERSION}-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-unsigned-ipa
          path: Orvian-*-unsigned.ipa

      - name: Publish LiveContainer version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          SIZE=$(stat -f%z "Orvian-${VERSION}-unsigned.ipa")
          TODAY=$(date +%Y-%m-%d)
          TAG="v${VERSION}"
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES=$(git log "${PREVIOUS_TAG}..HEAD" --no-merges --format='• %s')
          else
            NOTES="• Première version publiée automatiquement"
          fi
          NOTES=${NOTES:-"• Version publiée automatiquement depuis main"}
          UPDATED_REPO_JSON=$(mktemp)
          python3 .github/scripts/update_repo.py \
            "$VERSION" "$TAG" "$SIZE" "$TODAY" "$NOTES" repo.json \
            > "$UPDATED_REPO_JSON"
          mv "$UPDATED_REPO_JSON" repo.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml repo.json
          git commit -m "Release Orvian $VERSION (LiveContainer)"
          git push origin HEAD:main
          git tag -a "$TAG" -m "Orvian $VERSION"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: Orvian-${{ steps.version.outputs.value }}-unsigned.ipa
          generate_release_notes: true
