name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un seul job : produire l'IPA. Les vérifications lentes vivent dans
# checks.yml et ne s'exécutent que sur les pull requests, pour ne pas
# retarder une publication.
jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/heads/diagnostics/speech-probe') }}
    name: Build unsigned IPA (LiveContainer ready)
    runs-on: macos-26
    concurrency:
      # Serialize release writers.
      group: 'orvian-publish-main'
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip outdated publication
        id: publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REMOTE_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; build this revision without publishing it."
          fi

      - name: Compute next LiveContainer version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publication.outputs.skip != 'true'
        shell: bash
        run: |
          # Règle de numérotation : patch +1 à chaque push, minor +1 tous les
          # 10 pushes (compteur = commits mainline hors releases auto du bot).
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -z "$LATEST_TAG" ]]; then
            NEXT_VERSION="0.9.0"
          elif [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            if [[ "$MAJOR" -eq 0 && "$MINOR" -lt 9 ]]; then
              NEXT_VERSION="0.9.0"
            else
              BASE_TAG=$(git tag --list 'v[0-9]*.[0-9]*.0' --sort=-version:refname | head -n 1)
              PUSHES=$(git rev-list --count --first-parent "${BASE_TAG}..HEAD" --invert-grep --grep="^Release Orvian ")
              if [[ "$PUSHES" -gt 0 && $((PUSHES % 10)) -eq 0 ]]; then
                if [[ "$BASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.0$ ]]; then
                  NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
                else
                  echo "Tag de base invalide : $BASE_TAG" >&2
                  exit 1
                fi
              else
                NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
            fi
          else
            echo "Version de tag invalide : $LATEST_TAG" >&2
            exit 1
          fi
          # Preserve an intentional app-version increase so a published build
          # also updates installations of a newer candidate IPA.
          NEXT_VERSION=$(python3 - "$NEXT_VERSION" <<'PYVERSION'
          from pathlib import Path
          import re
          import sys

          computed = sys.argv[1]
          match = re.search(r'MARKETING_VERSION: "(\d+\.\d+\.\d+)"', Path("project.yml").read_text())
          if not match:
              raise SystemExit("MARKETING_VERSION invalide dans project.yml")
          declared = match.group(1)
          print(max((computed, declared), key=lambda version: tuple(map(int, version.split(".")))))
          PYVERSION
          )
          echo "value=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Set release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publication.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("project.yml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'MARKETING_VERSION: "[^"]+"',
              f'MARKETING_VERSION: "{sys.argv[1]}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("MARKETING_VERSION introuvable dans project.yml")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, generic iOS device)
        # Le runner est vierge : `clean` ne nettoierait que le DerivedDataPath
        # créé quelques secondes plus tôt par cette même étape.
        run: |
          set -o pipefail
          xcodebuild \
            -project Orvian.xcodeproj \
            -scheme Orvian \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Orvian.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Orvian-${VERSION}-unsigned.ipa" Payload
          ls -lh "Orvian-${VERSION}-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-unsigned-ipa
          path: Orvian-*-unsigned.ipa

      - name: Publish LiveContainer version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.publication.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          # A user may push while the build is running. Never publish that
          # superseded revision or rebase generated release metadata onto it.
          REMOTE_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "Main changed during the build; skip publication."
            exit 0
          fi
          SIZE=$(stat -f%z "Orvian-${VERSION}-unsigned.ipa")
          TODAY=$(date +%Y-%m-%d)
          TAG="v${VERSION}"
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES=$(git log "${PREVIOUS_TAG}..HEAD" --no-merges --format='• %s')
          else
            NOTES="• Première version publiée automatiquement"
          fi
          NOTES=${NOTES:-"• Version publiée automatiquement depuis main"}
          python3 .github/scripts/update_repo.py "$VERSION" "$TAG" "$SIZE" "$TODAY" "$NOTES" > repo.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml repo.json
          git commit -m "Release Orvian $VERSION (LiveContainer)"
          git tag -a "$TAG" -m "Orvian $VERSION"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: Orvian-${{ steps.version.outputs.value }}-unsigned.ipa
          generate_release_notes: true

  speech-probe:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/diagnostics/speech-probe')
    name: Build separate audio diagnostic IPA
    runs-on: macos-26
    timeout-minutes: 20
    concurrency:
      group: orvian-speech-probe-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run nonvisual diagnostic contracts
        run: |
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 .github/scripts/check_speech_probe.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile dedicated diagnostic app without launching it
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Orvian.xcodeproj \
            -scheme Orvian \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-speech-probe \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) ORVIAN_SPEECH_PROBE' \
            PRODUCT_BUNDLE_IDENTIFIER=com.orvian.app.speechprobe \
            'INFOPLIST_KEY_CFBundleDisplayName=Orvian Test IA' \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/orvian-speech-probe-build.log"

      - name: Package isolated LiveContainer diagnostic IPA
        shell: bash
        run: |
          set -euo pipefail
          APP='build-speech-probe/Build/Products/Release-iphoneos/Orvian.app'
          test -d "$APP"
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Orvian Test IA' "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = 'Orvian Test IA'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'com.orvian.app.speechprobe'
          mkdir -p diagnostic/Payload
          cp -R "$APP" diagnostic/Payload/
          IPA="Orvian-Test-IA-${GITHUB_SHA:0:8}-unsigned.ipa"
          (cd diagnostic && zip -qry "../$IPA" Payload/)
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload diagnostic IPA and compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orvian-Test-IA-${{ github.sha }}
          path: |
            Orvian-Test-IA-*-unsigned.ipa
            ${{ runner.temp }}/orvian-speech-probe-build.log

      - name: Publish diagnostic prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="speech-probe-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title 'Orvian Test IA — diagnostic audio uniquement' \
            --notes 'IPA de test distinct pour LiveContainer. Ouvrir une vidéo kDrive anglaise à 1×, déplier Test audio IA (développement), puis Tester l’audio anglais. Télécharger le modèle si proposé. Ne remplace pas la version normale ; ne contient pas encore la traduction française. Aucun test visuel ni capture exécuté.'
