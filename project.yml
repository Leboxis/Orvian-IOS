name: Orvian
options:
  bundleIdPrefix: com.orvian
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.172"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_CFBundleDisplayName: Orvian
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
      UIInterfaceOrientationPortrait
      UIInterfaceOrientationLandscapeLeft
      UIInterfaceOrientationLandscapeRight
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  Orvian:
    type: application
    platform: iOS
    sources:
      - path: Orvian
      - path: OrvianLiveActivity/UploadActivityAttributes.swift
    dependencies:
      - target: OrvianUploadActivity
    info:
      path: Orvian/Info.plist
      properties:
        UIBackgroundModes:
          - audio
        NSFaceIDUsageDescription: "Face ID sert à déverrouiller l'app sans saisir votre code."
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orvian.app
        TARGETED_DEVICE_FAMILY: "1,2"
  OrvianUploadActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: OrvianLiveActivity
    info:
      path: OrvianLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Orvian
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orvian.app.uploadactivity
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"

schemes:
  Orvian:
    build:
      targets:
        Orvian: all
        OrvianUploadActivity: all
    run:
      config: Debug
    archive:
      config: Release
